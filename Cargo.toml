[package]
name = "seeds-ai"
version = "0.10.1"
edition = "2021"
description = "A beads-compatible issue tracker for AI agents that stores work items as facts in a quipu knowledge graph"
license = "Apache-2.0"
repository = "https://github.com/scbrown/seeds"
# 1.89 for `std::fs::File::lock`, the cross-process write lock the native
# store takes (see src/native/store.rs). quipu-ai itself needs 1.85.
rust-version = "1.89"
readme = "README.md"
homepage = "https://github.com/scbrown/seeds"
keywords = ["ai-agents", "issue-tracker", "knowledge-graph", "quipu", "beads"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "seeds"
path = "src/lib.rs"

[[bin]]
name = "sd"
path = "src/main.rs"
required-features = ["native"]

[features]
# `native` is the `sd` CLI: argument parsing, TOML config resolution, the local
# store file and its lock, and the system clock. Everything outside it is the
# core, which builds for wasm32-unknown-unknown with `--no-default-features`
# (see `just wasm`).
default = ["native"]
native = ["dep:spargebra", "dep:libc", "dep:url", "dep:clap", "dep:clap_complete", "dep:toml", "dep:ureq", "dep:ed25519-dalek", "dep:getrandom", "dep:base64", "dep:jiff", "dep:yaml-rust2", "shacl"]
# Validate every write against the WorkItem shapes (camayoc's, plus the seeds
# shape). quipu's SHACL engine is not part of quipu's own wasm32 gate, so the
# wasm build leaves it out and says so rather than claiming a check it did not
# run.
shacl = ["quipu/shacl", "dep:shacl-pin"]

[dependencies]
quipu = { package = "quipu-ai", git = "https://github.com/intigraph/quipu", rev = "fec93ae63adcdf49e7bf1ce5e6b060f9650bb5e9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# XSD canonical lexical forms for the typed times and the duration seeds
# writes: the same crate (oxigraph's datatypes) a quipu server's /update
# canonicalizes through, so local, remote and the server hold the same bytes.
# Pure Rust, in the wasm core too. MIT OR Apache-2.0.
oxsdatatypes = "0.2"
oxiri = "0.2"
# Parse the same query algebra as Quipu before admitting local projection reads.
spargebra = { version = "0.4", features = ["sep-0006"], optional = true }
sha2 = "0.10"
clap = { version = "4.5", features = ["derive", "env"], optional = true }
# Shell completions for `sd completions` (native only; same project as clap).
clap_complete = { version = "4.5", optional = true }
toml = { version = "0.8", optional = true }
# The shared-server backend (native only): quipu over HTTP.
ureq = { version = "2", optional = true }
url = { version = "2", optional = true }
# Signed writes to quipu (native only): an Ed25519 key registered once with
# `quipu attest`, a random nonce per write, base64url for the header.
ed25519-dalek = { version = "2", optional = true }
getrandom = { version = "0.2", optional = true }
libc = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }
# The local time zone (native only): a bare --due date means 09:00 local, as
# br stores it. Unlicense OR MIT.
jiff = { version = "0.2", optional = true }
# --agent-context @file.yaml (already in the tree via shacl; MIT OR Apache-2.0).
yaml-rust2 = { version = "0.10", optional = true }
# Match the pinned shared-applier release's SHACL engine.
shacl-pin = { package = "shacl", version = "=0.3.25", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = { version = "1.0.151", features = ["raw_value"] }
ring = "0.17"
tempfile = "3"
