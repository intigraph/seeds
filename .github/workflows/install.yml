name: Installer controls
on:
  pull_request:
  push:
    branches: [main]
# Supersede the same PR without canceling independent main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate standalone entrypoint and refusal controls
        run: |
          sh -n install.sh
          python3 scripts/test-install-release.py
