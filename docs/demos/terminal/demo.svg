<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Seeds: capture work, then read the ready queue</title>
<desc id="desc">Real native CLI using a new isolated local store and explicit public fixture graph/prefix/actor; no server, sync, production ledger or crew backend change. The animation repeats. The adjacent transcript provides a static alternative.</desc>
<rect width="100%" height="100%" rx="16" fill="#101827"/>
<path d="M0 54H1000" stroke="#334155"/>
<circle cx="28" cy="27" r="7" fill="#fb7185"/>
<circle cx="52" cy="27" r="7" fill="#fbbf24"/>
<circle cx="76" cy="27" r="7" fill="#34d399"/>
<text x="110" y="34" fill="#e2e8f0" font-family="monospace" font-size="20">Seeds: capture work, then read the ready queue</text>
<g id="frame0" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="visible;hidden;hidden" keyTimes="0.000000;0.250000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ sd --store demo.db --graph urn:seeds:readme-demo --actor demo </text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">create &#x27;Write the parser&#x27; -p 1</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">created ○ demo-7vl [P1] [task] Write the parser (tx 2)</text>
</g>
<g id="frame1" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.250000;0.600000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ sd --store demo.db --graph urn:seeds:readme-demo --actor demo </text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">ready</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">○ demo-7vl [P1] [task] Write the parser</text>
</g>
<g id="frame2" visibility="visible" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;visible" keyTimes="0.000000;0.600000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ sd --store demo.db --graph urn:seeds:readme-demo --actor demo </text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">stats --no-activity</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">total 1</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">  open 1 · in progress 0 · blocked 0 · deferred 0 · closed 0</text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">  ready now 1</text>
<text x="28" y="254" fill="#f1f5f9" xml:space="preserve">  epics ready to close 0</text>
<text x="28" y="286" fill="#f1f5f9" xml:space="preserve">  average lead time 0.0 h</text>
</g>
</svg>
